# Netlify deploy config. Nitro auto-detects Netlify and builds the server to
# .netlify/functions-internal and static assets to dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions-internal/server"
  status = 200
